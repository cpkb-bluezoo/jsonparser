name: Publish to Maven Central

# Ant builds the jar/sources-jar/javadoc-jar; this workflow only signs them
# and assembles/uploads the bundle Sonatype's Central Publisher API expects.
# Maven itself is never invoked - pom.xml supplies metadata only.
#
# publishingType is deliberately USER_MANAGED, not AUTOMATIC: the bundle is
# uploaded and validated, but does not go live on Central until a maintainer
# reviews it and clicks "Publish" in https://central.sonatype.com - a
# deliberate safety gate, since a released version can never be deleted or
# overwritten once public. Switch to AUTOMATIC only once this pipeline has
# been trusted through a few manual releases.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Build release artifacts with Ant
        run: ant release release-sources release-javadoc -Drelease=${{ steps.version.outputs.version }}

      - name: Import GPG key
        run: echo "$GPG_PRIVATE_KEY" | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Assemble and sign Central bundle
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -e

          mkdir -p ~/.gnupg
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpgconf --reload gpg-agent

          BUNDLE_DIR=bundle/org/bluezoo/jsonparser/$VERSION
          mkdir -p "$BUNDLE_DIR"

          cp pom.xml "$BUNDLE_DIR/jsonparser-$VERSION.pom"
          cp "dist/jsonparser-$VERSION.jar" "$BUNDLE_DIR/"
          cp "dist/jsonparser-$VERSION-sources.jar" "$BUNDLE_DIR/"
          cp "dist/jsonparser-$VERSION-javadoc.jar" "$BUNDLE_DIR/"

          cd "$BUNDLE_DIR"
          for f in *.jar *.pom; do
            gpg --batch --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" -ab "$f"
            md5sum "$f" | cut -d' ' -f1 > "$f.md5"
            sha1sum "$f" | cut -d' ' -f1 > "$f.sha1"
          done
          cd "$GITHUB_WORKSPACE"

          (cd bundle && zip -r ../central-bundle.zip .)

      - name: Upload artifact for inspection
        uses: actions/upload-artifact@v7
        with:
          name: central-bundle
          path: central-bundle.zip

      - name: Upload to Maven Central
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        run: |
          set -e
          TOKEN=$(printf '%s:%s' "$CENTRAL_TOKEN_USERNAME" "$CENTRAL_TOKEN_PASSWORD" | base64 -w0)
          curl --fail --request POST \
            -H "Authorization: Bearer $TOKEN" \
            --form bundle=@central-bundle.zip \
            "https://central.sonatype.com/api/v1/publisher/upload?publishingType=USER_MANAGED"
